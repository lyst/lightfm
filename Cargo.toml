[package]
name = "lightfm_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "_lightfm_fast_rust"
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
numpy = "0.21"
rayon = "1.10"
parking_lot = "0.12"
rand = "0.8"
rand_xoshiro = "0.6"
wide = "0.7.33"
wgpu = "22.0.0"
pollster = "0.4.0"
futures-intrusive = "0.5.0"
bytemuck = { version = "1.24.0", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
